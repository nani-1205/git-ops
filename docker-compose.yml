version: '3.8'

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "5050:5050"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gitlab-scanner
    restart: unless-stopped

  gitlab-scanner:
    build: .
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=scanner
      - DB_PASSWORD=scanner_password
      - DB_NAME=scanner_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_TTL_GROUPS=30
      - CACHE_TTL_PROJECTS=15
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    deploy:
      replicas: 3

  db:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=scanner
      - POSTGRES_PASSWORD=scanner_password
      - POSTGRES_DB=scanner_db
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanner -d scanner_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
