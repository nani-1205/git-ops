events {
    worker_connections 1024;
}

http {
    upstream scanner_app {
        # The service name "gitlab-scanner" resolves to the IP addresses of all 3 replicas
        server gitlab-scanner:5050;
    }

    server {
        listen 5050;

        location / {
            proxy_pass http://scanner_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Allow large payloads (PDF downloads, JSON requests)
            client_max_body_size 50M;
        }
    }
}
